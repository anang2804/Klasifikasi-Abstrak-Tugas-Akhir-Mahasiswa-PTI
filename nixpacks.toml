[phases.setup]
nixPkgs = ['python312', 'python312Packages.pip', 'python312Packages.virtualenv', 'gcc']

[phases.install]
cmds = [
  'python -m venv /opt/venv',
  '. /opt/venv/bin/activate && pip install --upgrade pip',
  '. /opt/venv/bin/activate && pip install -r requirements.txt'
]

[start]
cmd = '. /opt/venv/bin/activate && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2 --worker-class gevent --worker-connections 1000'
